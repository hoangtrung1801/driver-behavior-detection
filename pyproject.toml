[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cdira-reproduction"
version = "0.1.0"
description = "Research reproduction of C-DIRA driver behavior recognition"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "Pillow>=11,<12",
  "PyYAML>=6,<7",
  "pydantic>=2.8,<3",
  "typer>=0.16,<1",
  "torchmetrics>=1.7,<2",
  "fvcore>=0.1.5",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "kaggle>=1.7,<2",
  "rich>=13,<15",
]

[project.optional-dependencies]
app = [
  "opencv-python-headless>=4.10,<5",
  "streamlit>=1.40,<2",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
cdira = "cdira.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
